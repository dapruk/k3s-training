apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-fullstack-be
  namespace: k3s-training
  annotations:
    k3s-training/deployed-by: instructor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: training-fullstack-be
  template:
    metadata:
      labels:
        app: training-fullstack-be
      annotations:
        k3s-training/deployed-by: instructor
        k3s-training/git-sha: IMAGE_GIT_SHA
    spec:
      containers:
        - name: app
          image: <registry>/k3s-training/fullstack-be:instructor-replacement-IMAGE_GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
