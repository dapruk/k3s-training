name: Build container images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.builds.outputs.matrix }}
      count: ${{ steps.builds.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: builds
        run: node scripts/discover-builds.mjs >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and participant submissions
        shell: bash
        run: |
          sh -n scripts/*.sh test-run/*.sh
          while IFS= read -r case_dir; do
            find "$case_dir" -name Dockerfile -print -quit | grep -q . || continue
            case_name=$(basename "$case_dir")
            participant=$(basename "$(dirname "$case_dir")")
            ./scripts/validate-submission.sh "$participant" "$case_name"
          done < <(find participants -mindepth 2 -maxdepth 2 -type d -print | sort)

  build:
    needs: [discover, validate]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase GHCR registry path
        id: registry
        shell: bash
        run: echo "path=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/k3s-training" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.registry.outputs.path }}/${{ matrix.image }}:${{ matrix.owner }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            training.hairnerds.id/deployed-by=${{ matrix.owner }}
            training.hairnerds.id/case=${{ matrix.case }}
          cache-from: type=gha,scope=${{ matrix.owner }}-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.owner }}-${{ matrix.image }}
